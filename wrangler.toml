name = "the-65-percent-rule"
main = "worker/index.ts"
compatibility_date = "2026-08-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Only /buy and /payu/* run the Worker first. The marketing site remains
# globally cached static assets everywhere else.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/buy*", "/payu/*"]
html_handling = "auto-trailing-slash"

# Non-secret configuration. PAYU_KEY and PAYU_SALT are Cloudflare secrets.
[vars]
PAYU_ENV = "test"
SITE_URL = "https://the-65-percent-rule.machine-shubhu.workers.dev"

# D1 order store — records every verified purchase (used by /payu/return).
[[d1_databases]]
binding = "DB"
database_name = "the-65-percent-rule-orders"
database_id = "9c13e940-1478-4f92-83e3-a2f5ace3eb62"

[observability]
enabled = true
